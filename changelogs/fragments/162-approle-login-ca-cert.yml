bugfixes:
  - module_utils/authentication.py - Issue the AppRole login request on the ``VaultClient`` session so that
    ``ca_cert`` (and the ``VAULT_CACERT`` environment variable) and ``tls_skip_verify`` are honoured. The login
    previously used a module level ``requests.post()`` call, which builds its own session and falls back to the
    certifi bundle, so authenticating against a Vault server with a private CA failed with
    ``CERTIFICATE_VERIFY_FAILED`` unless the undocumented ``REQUESTS_CA_BUNDLE`` variable was set
    (https://github.com/ansible-collections/hashicorp.vault/issues/126,
    https://github.com/ansible-collections/hashicorp.vault/pull/162).
  - module_utils/authentication.py - Apply the ``proxies`` and ``retries`` client settings to the AppRole login
    request, which previously bypassed them
    (https://github.com/ansible-collections/hashicorp.vault/pull/162).
